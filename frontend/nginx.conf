resolver 127.0.0.11 valid=5s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://microprofits-backend-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://microprofits-backend-1:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
